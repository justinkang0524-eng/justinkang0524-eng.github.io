<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justin Kang</title>
<meta name="description" content="Chemical Engineering Honours student at Monash University.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8;
    --text: #1c1c1c;
    --muted: #666;
    --line: #e4e4e0;
    --accent: #0f6e5c;
    --accent-soft: #e3f1ed;
    --card: #ffffff;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121413;
      --text: #ececec;
      --muted: #9a9a9a;
      --line: #2a2d2c;
      --accent: #4fc3a1;
      --accent-soft: #1d332d;
      --card: #1a1d1c;
      --danger: #f2827a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-size: 16px;
  }
  a { color: var(--accent); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 20px 80px; }
  .wrap.has-bar { padding-bottom: 170px; }
  header { margin-bottom: 8px; }
  h1 { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .tagline { font-size: 1.1rem; color: var(--muted); margin-top: 6px; }
  .links { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
  .links a {
    color: var(--accent); text-decoration: none; font-weight: 500;
    border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px;
    font-size: 0.92rem;
  }
  .links a:hover { border-color: var(--accent); }

  /* Tabs between Experience and Interests */
  .nav { display: flex; gap: 24px; margin-top: 32px; border-bottom: 1px solid var(--line); }
  .nav a {
    padding: 8px 0; text-decoration: none; color: var(--muted); font-weight: 600;
    font-size: 0.95rem; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .nav a:hover { color: var(--text); }
  .nav a.active { color: var(--accent); border-bottom-color: var(--accent); }

  section { margin-top: 44px; }
  h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--accent); font-weight: 600; margin-bottom: 18px;
  }
  .hint { color: var(--muted); font-size: 0.92rem; margin-top: 28px; }

  /* About section with photo */
  .about-row { display: flex; gap: 28px; align-items: flex-start; }
  .about-row > .prose { flex: 1; min-width: 0; }
  .photo {
    width: 160px; height: 160px; flex-shrink: 0; border-radius: 50%;
    object-fit: cover; border: 1px solid var(--line); background: var(--card);
  }
  @media (max-width: 600px) {
    .about-row { flex-direction: column; align-items: center; gap: 20px; }
    .about-row > .prose { width: 100%; }
    .photo { width: 140px; height: 140px; }
  }
  .prose, .summary { white-space: pre-line; }

  /* Cards */
  .item {
    display: block; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 14px;
    color: inherit; text-decoration: none;
  }
  a.item:hover { border-color: var(--accent); }
  a.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; }
  .item h3 { font-size: 1.02rem; font-weight: 600; }
  .when { color: var(--muted); font-size: 0.9rem; }
  .org { color: var(--muted); font-size: 0.95rem; }
  .summary { margin-top: 8px; font-size: 0.96rem; }
  .card-row { display: flex; gap: 16px; align-items: flex-start; }
  .card-body { flex: 1; min-width: 0; }
  .logo {
    width: 48px; height: 48px; flex-shrink: 0; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; object-fit: contain; padding: 4px;
  }
  .logo.large { width: 80px; height: 80px; border-radius: 14px; padding: 6px; }
  .back { display: table; }
  .page-head { display: flex; gap: 20px; align-items: center; }
  .page-head-text { flex: 1; min-width: 0; }
  .page-head .page-org { margin-top: 4px; }
  @media (max-width: 520px) {
    .page-head { gap: 14px; align-items: flex-start; }
    .logo.large { width: 56px; height: 56px; border-radius: 12px; }
  }
  .monogram {
    display: flex; align-items: center; justify-content: center; padding: 0;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 1.2rem;
  }
  .monogram.large { font-size: 1.8rem; }
  @media (max-width: 520px) {
    .card-row { gap: 12px; }
    .logo { width: 40px; height: 40px; }
  }
  .more { display: inline-block; margin-top: 10px; color: var(--accent); font-size: 0.9rem; font-weight: 500; }
  .see-all { display: inline-block; margin-top: 4px; font-weight: 500; font-size: 0.92rem; text-decoration: none; }
  .see-all:hover { text-decoration: underline; }

  .back {
    display: inline-block; color: var(--accent); text-decoration: none;
    font-weight: 500; font-size: 0.92rem; margin-bottom: 28px;

  .page-when { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
  .page-summary { margin-top: 20px; font-size: 1.05rem; white-space: pre-line; }
  .page h1 { font-size: 2.1rem; }

  .chip, .topic {

    padding: 3px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 500;

  .card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; color: var(--muted); font-size: 0.85rem; }
  .card-meta .topic { font-size: 0.78rem; padding: 2px 9px; }

    position: relative; width: 100%; aspect-ratio: 16 / 9; margin-top: 24px;
    border-radius: 10px; overflow: hidden; background: #000;
  }
  .video iframe, .video video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .post-body { margin-top: 24px; font-size: 1.02rem; white-space: pre-line; }
  .empty { color: var(--muted); margin-top: 32px; }
  .diary-entry {
    border-left: 2px solid var(--line); padding: 2px 0 2px 18px; margin-bottom: 22px;
    position: relative;
  }
  .diary-entry::before {
    content: ""; position: absolute; left: -6px; top: 8px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent);
  }
  .diary-date { font-size: 0.85rem; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .diary-date input, .date-input {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;

  .page-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 56px; flex-wrap: wrap; }
  .page-nav a { text-decoration: none; font-weight: 500; font-size: 0.92rem; }
  footer { margin-top: 64px; color: var(--muted); font-size: 0.85rem; }

  /* Edit mode */
  .editable {
    outline: 1px dashed var(--line); border-radius: 4px;
    padding: 2px 6px; margin: 2px -6px; min-height: 1.5em; min-width: 4em;

  .editable:hover { outline-color: var(--muted); }
  .editable:focus { outline: 2px solid var(--accent); }
  .editable:empty::before { content: attr(data-placeholder); color: var(--muted); font-weight: 400; }
  .topic.editable { margin: 0; padding: 3px 10px; }
  .inputs { display: grid; gap: 10px; margin-top: 20px; }
  .inp { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
  .inp input {
    font: inherit; font-size: 0.95rem; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%;

  .inp input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { font: inherit; cursor: pointer; }
  .add {
    width: 100%; padding: 12px; border: 1px dashed var(--line); border-radius: 10px;
    background: none; color: var(--accent); font-weight: 500;
  }
  .add:hover { border-color: var(--accent); }
  .row-btns { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .open-page { color: var(--accent); font-weight: 500; font-size: 0.9rem; text-decoration: none; }
  .del {
    background: none; border: none; color: var(--danger);
    font-size: 0.85rem; padding: 0;
  }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: space-between;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
  }
  .bar span { font-size: 0.88rem; color: var(--muted); }
  .bar-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .bar button {
    border: none; background: var(--accent); color: #fff;
    padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
  }
  .bar button.ghost { background: none; color: var(--accent); border: 1px solid var(--line); }
  @media (max-width: 520px) {
    h1, .page h1 { font-size: 1.9rem; }
    .wrap { padding-top: 40px; }
  }
</style>
</head>

          "story": "For three months I worked in the engineering department at Nestlé’s Chembong factory in Negeri Sembilan. Instead of staying in one team, I rotated through four: confectionery engineering, projects, general services and maintenance, with time alongside quality assurance too. It gave me a view of how a large food plant actually runs, from the production line to the water and power keeping it going.\n\nIn the chocolate plant, I monitored production, checked equipment and recorded data at critical control points. I also ran safety inspections in areas where fine dust and heat can create explosion risks, checking machines for proper sealing, grounding and ventilation, then wrote short reports with fixes. I helped write the standard operating procedures and settings for a new KitKat line as it was being commissioned.\n\nOn the utilities side, I supported a RM 26 million wastewater treatment upgrade through membrane trials and flow estimates across three plants. Site-wide energy audits I worked on found RM 1.5 million in yearly savings, and I set water use benchmarks for the whole plant. I also proposed a microalgae system to capture 3 tonnes of CO₂ a year as part of Nestlé’s 2050 Net Zero plan, an idea I’d brought from my work at MC³.\n\nBehind the scenes, I built an Excel tool that cut audit preparation time by over 75%, checked two years of records across more than 100 parameters to get them audit-ready, and helped the maintenance team with routines, records and a framework for understanding their technicians’ skills.",

    {

          "id": "saint-gobain-fyp",

          "summary": "Investigating recycled plastic as backfill around buried ductile-iron pipelines, and how surrounding soil affects corrosion. Includes a review of Australian and European standards for pipeline installation.",
          "story": "When a water pipe goes into the ground, it gets buried in “backfill”, the material packed around it. Usually that’s sand or soil. But using recycled waste instead, like crushed concrete, slag, glass fines and tyre products, could save money and keep tonnes of material out of landfill.\n\nThe catch is corrosion. Different materials change the soil chemistry around a pipe, and some could eat away at it faster. Saint-Gobain PAM makes ductile iron pipes used across Australia, and my project asks a simple question: which recycled backfills are safe to use, and which aren’t?\n\nAustralia makes this harder than most places. Our pipelines run through swelling clays, salty coastal sands and acid sulfate soils, often with big swings between wet and dry. A material that’s fine in one place could be a problem in another, so the testing has to reflect real Australian ground.\n\nTo answer the question, I started by reading what’s already known about recycled backfill and Australian soils. Then I test samples in the lab, measuring things like moisture, grain size, pH, how well the soil conducts electricity, and how much salt and sulfate it holds. These all affect how quickly metal corrodes.\n\nI bury metal samples in boxes of natural, recycled and mixed backfill, then measure how fast they corrode using electrochemical tests and by weighing how much metal is lost over time. To make it realistic, I cycle the samples through wet and dry spells and temperature changes like those in Australian ground.\n\nThe goal is a practical guide: which recycled blends are low-risk, and which need extra protection like pipe wraps, coatings, sacrificial anodes or better drainage. I’m also drafting a short checklist that councils and water utilities can use when they put new pipeline work out to tender.",

(function () {

  /* ---------- helpers ---------- */

  function h(tag, props, children) {

        if (v == null || v === false) continue;

    });
    return e;
  }

  function tidy(s) { return (s || '').replace(/ /g, ' ').trim(); }
  function noEnter(e) { if (e.key === 'Enter') e.preventDefault(); }

  function slugify(s) {
    return tidy(s).toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50) || 'entry';

  // Split "A, B (C, D), E" into ["A", "B (C, D)", "E"], keeping commas inside brackets.
  function splitSkills(str) {
    var out = [], cur = '', depth = 0;
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      if (ch === '(' || ch === '[') depth++;
      else if ((ch === ')' || ch === ']') && depth > 0) depth--;
      if (ch === ',' && depth === 0) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // Fix skills that were split in the middle of brackets by older versions.
  function repairSkills(arr) {
    var out = [], buf = null;
    function balance(s) { return (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length; }
    arr.forEach(function (s) {
      buf = buf === null ? s : buf + ', ' + s;
      if (balance(buf) <= 0) { out.push(buf); buf = null; }
    });
    if (buf !== null) out.push(buf);
    return out;
  }

  function allItems() {
    var out = [];
    data.sections.forEach(function (s) { s.items.forEach(function (it) { out.push(it); }); });

  // Make older saved files work with this version.
  function upgrade(d) {
    var used = {};
    d.sections = d.sections || [];
    d.sections.forEach(function (s) {
      s.items = s.items || [];
      s.items.forEach(function (it) {
        it.skills = repairSkills(it.skills || []);
        it.diary = it.diary || [];
        ['title', 'org', 'when', 'summary', 'story', 'lessons', 'logo'].forEach(function (k) { it[k] = it[k] || ''; });
        var id = it.id || slugify(it.org ? it.org + ' ' + it.title : it.title);
        if (id === 'interests') id = 'interests-entry';
        var base = id, n = 2;

  function excerpt(s, n) {

  // Only allow web links (https://...) or a plain file name in the same folder.
  function safeUrl(url) {

  // Turn a YouTube, Vimeo or video file link into a player.
  function videoEmbed(raw) {
    var url = safeUrl(raw);
    if (!url) return null;
    var m, src = null;
    if ((m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/))) {

      h('input', {
        type: 'text', value: obj[key] || '', placeholder: ph,
        oninput: function (e) { obj[key] = e.target.value; dirty = true; if (onChange) onChange(); }
      })
    ]);
  }

  /* ---------- shared top of the site ---------- */

  function renderTop(active) {
    var header = [
      field('h1', data, 'name', '', 'Your name'),
      field('p', data, 'tagline', 'tagline', 'One line about you')
    ];
    if (editMode && active === 'experience') {
      header.push(h('div', { class: 'inputs' }, [
        input('Email', data, 'email', 'you@example.com'),
        input('LinkedIn link', data, 'linkedin', 'https://www.linkedin.com/in/...'),
        input('Resume file name', data, 'resume', 'resume.pdf (leave blank to hide the button)'),
        input('Photo file name', data, 'photo', 'photo.jpg (upload it to GitHub first, leave blank to hide)', function () {
          var slot = document.getElementById('photo-slot');
          if (slot) { slot.replaceChildren(); var img = photoImg(); if (img) slot.appendChild(img); }
        })
      ]));
    } else if (!editMode) {
      var links = [];
      if (tidy(data.email)) links.push(h('a', { href: 'mailto:' + tidy(data.email) }, ['Email']));
      if (safeUrl(data.linkedin)) links.push(h('a', { href: safeUrl(data.linkedin), target: '_blank', rel: 'noopener' }, ['LinkedIn']));
      if (safeUrl(data.resume)) links.push(h('a', { href: safeUrl(data.resume), target: '_blank', rel: 'noopener' }, ['Resume (PDF)']));
      if (links.length) header.push(h('div', { class: 'links' }, links));
    }
    var nav = h('nav', { class: 'nav', 'aria-label': 'Sections' }, [
      h('a', { href: '#/', class: active === 'experience' ? 'active' : null }, ['Experience']),
      h('a', { href: '#/interests', class: active === 'interests' ? 'active' : null }, ['Interests'])
    ]);
    return [h('header', null, header), nav];
  }

  /* ---------- home page (experience) ---------- */

  function renderCard(it, list, idx) {
    var head = [
      h('div', { class: 'item-top' }, [
        field('h3', it, 'title', '', 'Role or project'),
        field('span', it, 'when', 'when', 'Dates')
      ]),
      field('div', it, 'org', 'org', 'Organisation'),
      field('p', it, 'summary', 'summary', 'One or two lines about it', true)
    ];

    if (editMode) {
      var slot = h('div', { class: 'logo-slot' }, [logoEl(it, '')]);
      return h('div', { class: 'item' }, [h('div', { class: 'card-row' }, [
        slot,
        h('div', { class: 'card-body' }, head.concat([
          h('div', { class: 'inputs' }, [
            input('Logo file name (optional)', it, 'logo', 'e.g. csiro.png (upload it to GitHub first)', function () {
              slot.replaceChildren(logoEl(it, ''));
            })
          ]),
          h('div', { class: 'row-btns' }, [
            h('a', { class: 'open-page', href: '#/' + encodeURIComponent(it.id) }, ['Open page to write story, lessons and diary →']),
            h('button', {
              class: 'del', type: 'button',
              onclick: function () {
                if (confirm('Delete this entry and its page?')) { list.splice(idx, 1); dirty = true; render(); }
              }
            }, ['Delete'])
          ])
        ]))
      ])]);
    }

    return h('a', { class: 'item', href: '#/' + encodeURIComponent(it.id) }, [h('div', { class: 'card-row' }, [
      logoEl(it, ''),
      h('div', { class: 'card-body' }, head.concat([h('span', { class: 'more', text: 'View →' })]))
    ])]);
  }

  // The organisation's logo, or its first letter in a circle if there's no logo yet.
  function monogram(it, size) {
    var src = tidy(it.org) || tidy(it.title);
    var m = src.match(/[A-Za-z0-9]/);
    return h('div', { class: 'logo monogram ' + size, 'aria-hidden': 'true', text: m ? m[0].toUpperCase() : '•' });
  }

  function logoEl(it, size) {
    var src = safeUrl(it.logo);
    if (!src) return monogram(it, size);
    var img = h('img', {
      class: 'logo ' + size, src: src, alt: (tidy(it.org) || tidy(it.title)) + ' logo',
      onerror: function () { if (img.parentNode) img.parentNode.replaceChild(monogram(it, size), img); }
    });
    return img;
  }

  function renderSection(sec) {
    if (!editMode && !sec.items.length) return null;
    var kids = [field('h2', sec, 'title', '', 'Section name')];
    sec.items.forEach(function (it, i) { kids.push(renderCard(it, sec.items, i)); });
    if (editMode) {
      kids.push(h('button', {
        class: 'add', type: 'button',
        onclick: function () {
          sec.items.push({
            id: 'entry-' + Date.now().toString(36),
            title: '', org: '', when: '', summary: '', story: '', lessons: '', skills: [], diary: []
          });
          dirty = true; render();
        }
      }, ['+ Add entry']));
    }
    return h('section', null, kids);
  }

  function photoImg() {
    var src = safeUrl(data.photo);
    if (!src) return null;
    return h('img', {
      class: 'photo', src: src, alt: 'Photo of ' + (tidy(data.name) || 'me'),
      onerror: function () { this.style.display = 'none'; }
    });
  }

  function renderHome() {
    var kids = renderTop('experience');
    var about = field('p', data, 'about', 'prose', 'A few lines about you', true);
    var img = photoImg();
    if (about || img) {
      var row = editMode
        ? [h('div', { id: 'photo-slot' }, [img]), about]
        : [img, about];
      kids.push(h('section', null, [h('h2', { text: 'About' }), h('div', { class: 'about-row' }, row)]));
    }
    if (!editMode) kids.push(h('p', { class: 'hint', text: 'Click any entry to see what I did, what I learnt, and my diary from it.' }));
    data.sections.forEach(function (s) { kids.push(renderSection(s)); });

    // A peek at the latest interests, so visitors know the page exists.
    var latest = sortedPosts().filter(function (p) { return tidy(p.title); }).slice(0, 2);
    if (!editMode && latest.length) {
      var teaser = [h('h2', { text: 'Latest from my interests' })];
      latest.forEach(function (p) { teaser.push(postCard(p)); });
      teaser.push(h('a', { class: 'see-all', href: '#/interests' }, ['See all interests →']));
      kids.push(h('section', null, teaser));
    }
    return kids;
  }

  /* ---------- experience page ---------- */

  function renderDiary(it) {
    var kids = [];
    if (editMode) {
      kids.push(h('button', {
        class: 'add', type: 'button', style: 'margin-bottom:22px',
        onclick: function () { it.diary.unshift({ date: today(), text: '' }); dirty = true; render(); }
      }, ['+ Add diary entry']));
      it.diary.forEach(function (entry, i) {
        kids.push(h('div', { class: 'diary-entry' }, [
          h('div', { class: 'diary-date' }, [
            h('input', {
              type: 'date', value: entry.date || '',
              oninput: function (e) { entry.date = e.target.value; dirty = true; }
            })
          ]),
          field('p', entry, 'text', 'prose', 'What happened today? What did you work on, and how did it go?', true),
          h('div', { class: 'row-btns' }, [
            h('button', {
              class: 'del', type: 'button',
              onclick: function () {
                if (confirm('Delete this diary entry?')) { it.diary.splice(i, 1); dirty = true; render(); }
              }
            }, ['Delete entry'])
          ])
        ]));
      });
      return h('section', null, [h('h2', { text: 'Diary' })].concat(kids));
    }

    var entries = it.diary.filter(function (e) { return tidy(e.text); })
      .slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
    if (!entries.length) return null;
    entries.forEach(function (e) {
      kids.push(h('div', { class: 'diary-entry' }, [
        h('div', { class: 'diary-date', text: formatDate(e.date) }),
        h('p', { class: 'prose', text: e.text })
      ]));
    });
    return h('section', null, [h('h2', { text: 'Diary' })].concat(kids));
  }

  function block(title, node) {
    return node ? h('section', null, [h('h2', { text: title }), node]) : null;
  }

  function renderPage(it) {
    var list = allItems();
    var i = list.indexOf(it);
    var prev = list[i - 1], next = list[i + 1];

    var kids = [
      h('a', { class: 'back', href: '#/' }, ['← Back to all experience']),
      h('div', { class: 'page-head' }, [
        logoEl(it, 'large'),
        h('div', { class: 'page-head-text' }, [
          field('h1', it, 'title', '', 'Role or project'),
          field('div', it, 'org', 'page-org', 'Organisation'),
          field('div', it, 'when', 'page-when', 'Dates')
        ])
      ]),
      field('p', it, 'summary', 'page-summary', 'One or two lines about it', true)
    ];

    var doing = block("What I'm doing", field('p', it, 'story', 'prose', 'What is this role or project, what do you actually do day to day, and why does it matter?', true));
    var learnt = block('What I learnt', field('p', it, 'lessons', 'prose', 'What went well, what was hard, and what would you do differently?', true));
    var skills = block('Skills I built', skillsField(it));
    var diary = renderDiary(it);

    [doing, learnt, skills, diary].forEach(function (n) { if (n) kids.push(n); });
    if (!editMode && !doing && !learnt && !skills && !diary) {
      kids.push(h('p', { class: 'empty', text: 'More about this one coming soon.' }));
    }

    var nav = [];
    nav.push(prev ? h('a', { href: '#/' + encodeURIComponent(prev.id) }, ['← ' + (tidy(prev.title) || 'Previous')]) : h('span'));
    if (next) nav.push(h('a', { href: '#/' + encodeURIComponent(next.id) }, [(tidy(next.title) || 'Next') + ' →']));
    kids.push(h('div', { class: 'page-nav' }, nav));

    return [h('div', { class: 'page' }, kids)];
  }

  /* ---------- interests ---------- */

  function postHref(p) { return '#/interests/' + encodeURIComponent(p.id); }

  function postCard(p) {
    var meta = [];
    if (p.date) meta.push(h('span', { text: formatDate(p.date) }));
    if (tidy(p.topic)) meta.push(h('span', { class: 'topic', text: tidy(p.topic) }));
    if (safeUrl(p.video)) meta.push(h('span', { text: '▶ Video' }));
    var kids = [
      h('h3', { text: tidy(p.title) || 'Untitled post' }),
      meta.length ? h('div', { class: 'card-meta' }, meta) : null,
      tidy(p.text) ? h('p', { class: 'summary', text: excerpt(p.text, 180) }) : null
    ];
    if (editMode) {
      return h('div', { class: 'item' }, kids.concat([
        h('div', { class: 'row-btns' }, [
          h('a', { class: 'open-page', href: postHref(p) }, ['Open to edit →']),
          h('button', {
            class: 'del', type: 'button',
            onclick: function () {
              if (confirm('Delete this post?')) {
                data.interests.splice(data.interests.indexOf(p), 1); dirty = true; render();
              }
            }
          }, ['Delete'])
        ])
      ]));
    }
    return h('a', { class: 'item', href: postHref(p) }, kids.concat([h('span', { class: 'more', text: 'Read →' })]));
  }

  function renderInterests() {
    var kids = renderTop('interests');
    var intro = field('p', data, 'interestsIntro', 'prose', 'A line or two about what this page is for', true);
    var sec = [h('h2', { text: 'Interests' })];
    if (intro) sec.push(intro);
    kids.push(h('section', null, sec));

    var list = [];
    if (editMode) {
      list.push(h('button', {
        class: 'add', type: 'button', style: 'margin-bottom:18px',
        onclick: function () {
          var p = { id: 'post-' + Date.now().toString(36), title: '', date: today(), topic: '', video: '', text: '' };
          data.interests.push(p);
          dirty = true;
          location.hash = postHref(p);
        }
      }, ['+ New post']));
    }
    var posts = sortedPosts().filter(function (p) { return editMode || tidy(p.title) || tidy(p.text) || safeUrl(p.video); });
    posts.forEach(function (p) { list.push(postCard(p)); });
    if (!posts.length && !editMode) list.push(h('p', { class: 'empty', text: 'First post coming soon.' }));
    kids.push(h('section', { style: 'margin-top:28px' }, list));
    return kids;
  }

  function renderPost(p) {
    var posts = sortedPosts();
    var i = posts.indexOf(p);
    var newer = posts[i - 1], older = posts[i + 1];

    var kids = [h('a', { class: 'back', href: '#/interests' }, ['← Back to interests'])];
    kids.push(field('h1', p, 'title', '', 'Post title'));

    if (editMode) {
      kids.push(h('div', { class: 'meta' }, [
        h('input', {
          class: 'date-input', type: 'date', value: p.date || '',
          oninput: function (e) { p.date = e.target.value; dirty = true; }
        }),
        field('span', p, 'topic', 'topic', 'Topic, e.g. Energy')
      ]));
      var preview = h('div', null, [videoEmbed(p.video)]);
      kids.push(h('div', { class: 'inputs' }, [
        input('Video link (optional): YouTube, Vimeo, or an .mp4 file name', p, 'video', 'https://www.youtube.com/watch?v=...', function () {
          preview.replaceChildren();
          var v = videoEmbed(p.video);
          if (v) preview.appendChild(v);
        })
      ]));
      kids.push(preview);
      kids.push(field('div', p, 'text', 'post-body', 'Write your thoughts, a video script, or notes on what you learnt...', true));
      kids.push(h('div', { class: 'row-btns', style: 'margin-top:28px' }, [
        h('button', {
          class: 'del', type: 'button',
          onclick: function () {
            if (confirm('Delete this post?')) {
              data.interests.splice(data.interests.indexOf(p), 1); dirty = true; location.hash = '#/interests';
            }
          }
        }, ['Delete post'])
      ]));
    } else {
      var meta = [];
      if (p.date) meta.push(h('span', { text: formatDate(p.date) }));
      if (tidy(p.topic)) meta.push(h('span', { class: 'topic', text: tidy(p.topic) }));
      if (meta.length) kids.push(h('div', { class: 'meta' }, meta));
      kids.push(videoEmbed(p.video));
      if (tidy(p.text)) kids.push(h('div', { class: 'post-body', text: p.text }));
    }

    var nav = [];
    nav.push(older ? h('a', { href: postHref(older) }, ['← ' + (tidy(older.title) || 'Older post')]) : h('span'));
    if (newer) nav.push(h('a', { href: postHref(newer) }, [(tidy(newer.title) || 'Newer post') + ' →']));
    kids.push(h('div', { class: 'page-nav' }, nav));

    return [h('div', { class: 'page' }, kids)];
  }

  /* ---------- edit bar ---------- */

  function loadFromFile() {
    var picker = h('input', { type: 'file', accept: '.html,text/html' });
    picker.addEventListener('change', function () {
      var f = picker.files && picker.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var m = String(reader.result).match(/<script id="site-data" type="application\/json">([\s\S]*?)<\/script>/);
        if (!m) { alert("Couldn't find your website content in that file. Make sure it's an index.html you downloaded from this page."); return; }
        try {
          data = upgrade(JSON.parse(m[1]));
          dirty = true;
          location.hash = '#/';
          render();
          alert('Loaded. Check everything looks right, then click Download index.html.');
        } catch (err) {
          alert("That file couldn't be read. Make sure it's an index.html you downloaded from this page.");
        }
      };
      reader.readAsText(f);
    });
    picker.click();
  }

  function renderBar() {
    if (!canEdit) return null;
    return h('div', { class: 'bar' }, [
      h('span', { text: editMode ? 'Editing. Nothing changes online until you upload the downloaded file.' : 'Previewing your changes.' }),
      h('div', { class: 'bar-btns' }, [
        h('button', { class: 'ghost', type: 'button', onclick: loadFromFile }, ['Load from file']),
        h('button', { class: 'ghost', type: 'button', onclick: function () { editMode = !editMode; render(); } }, [editMode ? 'Preview' : 'Keep editing']),
        h('button', { type: 'button', onclick: download }, ['Download index.html'])
      ])
    ]);
  }

  /* ---------- render ---------- */

  function render() {
    var name = tidy(data.name);
    var r = route();
    var kids, title;

    if (r === 'interests') {
      kids = renderInterests();
      title = 'Interests';
    } else if (r && r.indexOf('interests/') === 0) {
      var p = findPost(r.slice('interests/'.length));
      if (p) { kids = renderPost(p); title = tidy(p.title) || 'Interests'; }
      else { kids = renderInterests(); title = 'Interests'; }
    } else {
      var it = r ? findItem(r) : null;
      if (it) { kids = renderPage(it); title = tidy(it.title) || 'Experience'; }
      else { kids = renderHome(); title = null; }
    }

    document.title = title ? title + (name ? ' | ' + name : '') : (name || 'Portfolio');
    kids.push(h('footer', { text: '© ' + new Date().getFullYear() + (name ? ' ' + name : '') }));
    app.replaceChildren(h('div', { class: 'wrap' + (canEdit ? ' has-bar' : '') }, kids));
    var bar = renderBar();
    if (bar) app.appendChild(bar);
  }

  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });

  /* ---------- download ---------- */

  function cleaned() {
    var c = JSON.parse(JSON.stringify(data));
    ['name', 'tagline', 'email', 'linkedin', 'resume', 'photo', 'about', 'interestsIntro'].forEach(function (k) { c[k] = tidy(c[k]); });
    var used = { interests: true };
    c.sections.forEach(function (s) {
      s.title = tidy(s.title);
      s.items = s.items.map(function (it) {
        var out = {
          id: it.id,
          title: tidy(it.title), org: tidy(it.org), when: tidy(it.when), logo: tidy(it.logo),
          summary: tidy(it.summary), story: tidy(it.story), lessons: tidy(it.lessons),
          skills: (it.skills || []).map(tidy).filter(Boolean),
          diary: (it.diary || []).map(function (e) { return { date: e.date || '', text: tidy(e.text) }; })
            .filter(function (e) { return e.text; })
        };
        // New entries get a readable web address based on their name.
        if (/^entry-/.test(out.id) && (out.title || out.org)) out.id = slugify(out.org ? out.org + ' ' + out.title : out.title);
        var base = out.id, n = 2;
        while (used[out.id]) out.id = base + '-' + (n++);
        used[out.id] = true;
        return out;
      }).filter(function (it) {
        return it.title || it.org || it.summary || it.story || it.lessons || it.diary.length;
      });
    });
    var usedPosts = {};
    c.interests = (c.interests || []).map(function (p) {
      var out = { id: p.id, title: tidy(p.title), date: p.date || '', topic: tidy(p.topic), video: tidy(p.video), text: tidy(p.text) };
      if (/^post-/.test(out.id) && out.title) out.id = slugify(out.title);
      var base = out.id, n = 2;
      while (usedPosts[out.id]) out.id = base + '-' + (n++);
      usedPosts[out.id] = true;
      return out;
    }).filter(function (p) { return p.title || p.text || p.video; });
    return c;
  }

  function escHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function download() {
    var c = cleaned();
    var json = JSON.stringify(c, null, 2).replace(/</g, '\\u003c');
    var out = ORIGINAL.replace(
      /(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/,
      function (m, a, b) { return a + '\n' + json + '\n' + b; }
    );
    out = out.replace(/<title>[\s\S]*?<\/title>/, function () { return '<title>' + escHtml(c.name || 'Portfolio') + '</title>'; });
    out = '<!DOCTYPE html>\n' + out.replace(/^<!DOCTYPE html>\s*/i, '');
    var blob = new Blob([out], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    dirty = false;
  }

  window.addEventListener('beforeunload', function (e) {
    if (canEdit && dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  render();
})();
</script></body></html>
