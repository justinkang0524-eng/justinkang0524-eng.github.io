<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Justin Kang</title>
<meta name="description" content="Chemical Engineering Honours student at Monash University.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8;
    --text: #1c1c1c;
    --muted: #666;
    --line: #e4e4e0;
    --accent: #0f6e5c;
    --accent-soft: #e3f1ed;
    --card: #ffffff;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121413;
      --text: #ececec;
      --muted: #9a9a9a;
      --line: #2a2d2c;
      --accent: #4fc3a1;
      --accent-soft: #1d332d;
      --card: #1a1d1c;
      --danger: #f2827a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-size: 16px;
  }
  a { color: var(--accent); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 20px 80px; }
  .wrap.has-bar { padding-bottom: 170px; }
  header { margin-bottom: 40px; }
  h1 { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .tagline { font-size: 1.1rem; color: var(--muted); margin-top: 6px; }
  .links { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
  .links a {
    color: var(--accent); text-decoration: none; font-weight: 500;
    border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px;
    font-size: 0.92rem;
  }
  .links a:hover { border-color: var(--accent); }
  section { margin-top: 44px; }
  h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--accent); font-weight: 600; margin-bottom: 18px;
  }
  .hint { color: var(--muted); font-size: 0.92rem; margin-top: 28px; }
  .prose, .summary { white-space: pre-line; }

  /* Cards on the home page */
  .item {
    display: block; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 14px;
    color: inherit; text-decoration: none;
  }
  a.item:hover { border-color: var(--accent); }
  a.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; }
  .item h3 { font-size: 1.02rem; font-weight: 600; }
  .when { color: var(--muted); font-size: 0.9rem; }
  .org { color: var(--muted); font-size: 0.95rem; }
  .summary { margin-top: 8px; font-size: 0.96rem; }
  .more { display: inline-block; margin-top: 10px; color: var(--accent); font-size: 0.9rem; font-weight: 500; }

  /* Experience page */
  .back {
    display: inline-block; color: var(--accent); text-decoration: none;
    font-weight: 500; font-size: 0.92rem; margin-bottom: 28px;
  }
  .back:hover { text-decoration: underline; }
  .page-org { color: var(--muted); font-size: 1.05rem; margin-top: 8px; }
  .page-when { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
  .page-summary { margin-top: 20px; font-size: 1.05rem; white-space: pre-line; }
  .page h1 { font-size: 2.1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--accent-soft); color: var(--accent);
    padding: 3px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 500;
  }
  .empty { color: var(--muted); margin-top: 32px; }
  .diary-entry {
    border-left: 2px solid var(--line); padding: 2px 0 2px 18px; margin-bottom: 22px;
    position: relative;
  }
  .diary-entry::before {
    content: ""; position: absolute; left: -6px; top: 8px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent);
  }
  .diary-date { font-size: 0.85rem; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .diary-date input {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
  }
  .page-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 56px; flex-wrap: wrap; }
  .page-nav a { text-decoration: none; font-weight: 500; font-size: 0.92rem; }
  footer { margin-top: 64px; color: var(--muted); font-size: 0.85rem; }

  /* Edit mode */
  .editable {
    outline: 1px dashed var(--line); border-radius: 4px;
    padding: 2px 6px; margin: 2px -6px; min-height: 1.5em; min-width: 4em;
  }
  .editable:hover { outline-color: var(--muted); }
  .editable:focus { outline: 2px solid var(--accent); }
  .editable:empty::before { content: attr(data-placeholder); color: var(--muted); font-weight: 400; }
  .inputs { display: grid; gap: 10px; margin-top: 20px; }
  .inp { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
  .inp input {
    font: inherit; font-size: 0.95rem; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%;
  }
  .inp input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { font: inherit; cursor: pointer; }
  .add {
    width: 100%; padding: 12px; border: 1px dashed var(--line); border-radius: 10px;
    background: none; color: var(--accent); font-weight: 500;
  }
  .add:hover { border-color: var(--accent); }
  .row-btns { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .open-page { color: var(--accent); font-weight: 500; font-size: 0.9rem; text-decoration: none; }
  .del {
    background: none; border: none; color: var(--danger);
    font-size: 0.85rem; padding: 0;
  }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: space-between;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
  }
  .bar span { font-size: 0.88rem; color: var(--muted); }
  .bar-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .bar button {
    border: none; background: var(--accent); color: #fff;
    padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
  }
  .bar button.ghost { background: none; color: var(--accent); border: 1px solid var(--line); }
  @media (max-width: 520px) {
    h1, .page h1 { font-size: 1.9rem; }
    .wrap { padding-top: 40px; }
  }
</style>
</head>

<script>
(function () {
  // Snapshot of the page before anything is drawn, used when downloading an updated copy.
  var ORIGINAL = document.documentElement.outerHTML;
  var data = JSON.parse(document.getElementById('site-data').textContent);
  var canEdit = /edit/i.test(location.search);
  var editMode = canEdit;
  var dirty = false;
  var app = document.getElementById('app');

  /* ---------- helpers ---------- */

  function h(tag, props, children) {
    var e = document.createElement(tag);
    if (props) {
      for (var k in props) {
        var v = props[k];
        if (v == null || v === false) continue;
        if (k === 'class') e.className = v;
        else if (k === 'text') e.textContent = v;
        else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? '' : v);
      }
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }

  function tidy(s) { return (s || '').replace(/ /g, ' ').trim(); }
  function noEnter(e) { if (e.key === 'Enter') e.preventDefault(); }

  function slugify(s) {
    return tidy(s).toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50) || 'entry';
  }

  function allItems() {
    var out = [];
    data.sections.forEach(function (s) { s.items.forEach(function (it) { out.push(it); }); });
    return out;
  }

  // Make older saved files work with this version: add ids and diaries where missing.
  function upgrade(d) {
    var used = {};
    d.sections.forEach(function (s) {
      s.items.forEach(function (it) {
        it.skills = it.skills || [];
        it.diary = it.diary || [];
        ['title', 'org', 'when', 'summary', 'story', 'lessons'].forEach(function (k) { it[k] = it[k] || ''; });
        var id = it.id || slugify(it.org ? it.org + ' ' + it.title : it.title);
        var base = id, n = 2;
        while (used[id]) id = base + '-' + (n++);
        used[id] = true;
        it.id = id;
      });
    });
    return d;
  }
  data = upgrade(data);

  function findItem(id) {
    var list = allItems();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function route() {
    var m = location.hash.match(/^#\/(.+)$/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function formatDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    if (p.length !== 3) return iso;
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return parseInt(p[2], 10) + ' ' + months[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  /* ---------- editable pieces ---------- */

  function field(tag, obj, key, cls, placeholder, multiline) {
    var val = obj[key] || '';
    if (!editMode) return tidy(val) ? h(tag, { class: cls, text: val }) : null;
    return h(tag, {
      class: (cls ? cls + ' ' : '') + 'editable',
      contenteditable: 'plaintext-only',
      'data-placeholder': placeholder,
      text: val,
      onkeydown: multiline ? null : noEnter,
      oninput: function (e) { obj[key] = e.target.innerText; dirty = true; }
    });
  }

  function skillsField(item) {
    if (!editMode) {
      if (!item.skills.length) return null;
      return h('div', { class: 'chips' }, item.skills.map(function (s) { return h('span', { class: 'chip', text: s }); }));
    }
    return h('div', {
      class: 'editable',
      contenteditable: 'plaintext-only',
      'data-placeholder': 'Skills, separated by commas',
      text: item.skills.join(', '),
      onkeydown: noEnter,
      oninput: function (e) {
        item.skills = e.target.innerText.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        dirty = true;
      }
    });
  }

  function input(label, key, ph) {
    return h('label', { class: 'inp' }, [
      h('span', { text: label }),
      h('input', {
        type: 'text', value: data[key] || '', placeholder: ph,
        oninput: function (e) { data[key] = e.target.value; dirty = true; }
      })
    ]);
  }

  /* ---------- home page ---------- */

  function renderCard(it, list, idx) {
    var head = [
      h('div', { class: 'item-top' }, [
        field('h3', it, 'title', '', 'Role or project'),
        field('span', it, 'when', 'when', 'Dates')
      ]),
      field('div', it, 'org', 'org', 'Organisation'),
      field('p', it, 'summary', 'summary', 'One or two lines about it', true)
    ];

    if (editMode) {
      return h('div', { class: 'item' }, head.concat([
        h('div', { class: 'row-btns' }, [
          h('a', { class: 'open-page', href: '#/' + encodeURIComponent(it.id) }, ['Open page to write story, lessons and diary →']),
          h('button', {
            class: 'del', type: 'button',
            onclick: function () {
              if (confirm('Delete this entry and its page?')) { list.splice(idx, 1); dirty = true; render(); }
            }
          }, ['Delete'])
        ])
      ]));
    }

    return h('a', { class: 'item', href: '#/' + encodeURIComponent(it.id) }, head.concat([
      h('span', { class: 'more', text: 'View →' })
    ]));
  }

  function renderSection(sec) {
    if (!editMode && !sec.items.length) return null;
    var kids = [field('h2', sec, 'title', '', 'Section name')];
    sec.items.forEach(function (it, i) { kids.push(renderCard(it, sec.items, i)); });
    if (editMode) {
      kids.push(h('button', {
        class: 'add', type: 'button',
        onclick: function () {
          sec.items.push({
            id: 'entry-' + Date.now().toString(36),
            title: '', org: '', when: '', summary: '', story: '', lessons: '', skills: [], diary: []
          });
          dirty = true; render();
        }
      }, ['+ Add entry']));
    }
    return h('section', null, kids);
  }

  function renderHome() {
    var header = [
      field('h1', data, 'name', '', 'Your name'),
      field('p', data, 'tagline', 'tagline', 'One line about you')
    ];
    if (editMode) {
      header.push(h('div', { class: 'inputs' }, [
        input('Email', 'email', 'you@example.com'),
        input('LinkedIn link', 'linkedin', 'https://www.linkedin.com/in/...'),
        input('Resume file name', 'resume', 'resume.pdf (leave blank to hide the button)')
      ]));
    } else {
      var links = [];
      if (tidy(data.email)) links.push(h('a', { href: 'mailto:' + tidy(data.email) }, ['Email']));
      if (tidy(data.linkedin)) links.push(h('a', { href: tidy(data.linkedin), target: '_blank', rel: 'noopener' }, ['LinkedIn']));
      if (tidy(data.resume)) links.push(h('a', { href: tidy(data.resume), target: '_blank', rel: 'noopener' }, ['Resume (PDF)']));
      if (links.length) header.push(h('div', { class: 'links' }, links));
    }

    var kids = [h('header', null, header)];
    var about = field('p', data, 'about', 'prose', 'A few lines about you', true);
    if (about) kids.push(h('section', null, [h('h2', { text: 'About' }), about]));
    if (!editMode) kids.push(h('p', { class: 'hint', text: 'Click any entry to see what I did, what I learnt, and my diary from it.' }));
    data.sections.forEach(function (s) { kids.push(renderSection(s)); });
    return kids;
  }

  /* ---------- experience page ---------- */

  function renderDiary(it) {
    var kids = [];
    if (editMode) {
      kids.push(h('button', {
        class: 'add', type: 'button', style: 'margin-bottom:22px',
        onclick: function () { it.diary.unshift({ date: today(), text: '' }); dirty = true; render(); }
      }, ['+ Add diary entry']));
      it.diary.forEach(function (entry, i) {
        kids.push(h('div', { class: 'diary-entry' }, [
          h('div', { class: 'diary-date' }, [
            h('input', {
              type: 'date', value: entry.date || '',
              oninput: function (e) { entry.date = e.target.value; dirty = true; }
            })
          ]),
          field('p', entry, 'text', 'prose', 'What happened today? What did you work on, and how did it go?', true),
          h('div', { class: 'row-btns' }, [
            h('button', {
              class: 'del', type: 'button',
              onclick: function () {
                if (confirm('Delete this diary entry?')) { it.diary.splice(i, 1); dirty = true; render(); }
              }
            }, ['Delete entry'])
          ])
        ]));
      });
      return h('section', null, [h('h2', { text: 'Diary' })].concat(kids));
    }

    var entries = it.diary.filter(function (e) { return tidy(e.text); })
      .slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
    if (!entries.length) return null;
    entries.forEach(function (e) {
      kids.push(h('div', { class: 'diary-entry' }, [
        h('div', { class: 'diary-date', text: formatDate(e.date) }),
        h('p', { class: 'prose', text: e.text })
      ]));
    });
    return h('section', null, [h('h2', { text: 'Diary' })].concat(kids));
  }

  function block(title, node) {
    return node ? h('section', null, [h('h2', { text: title }), node]) : null;
  }

  function renderPage(it) {
    var list = allItems();
    var i = list.indexOf(it);
    var prev = list[i - 1], next = list[i + 1];

    var kids = [
      h('a', { class: 'back', href: '#/' }, ['← Back to all experience']),
      field('h1', it, 'title', '', 'Role or project'),
      field('div', it, 'org', 'page-org', 'Organisation'),
      field('div', it, 'when', 'page-when', 'Dates'),
      field('p', it, 'summary', 'page-summary', 'One or two lines about it', true)
    ];

    var doing = block("What I'm doing", field('p', it, 'story', 'prose', 'What is this role or project, what do you actually do day to day, and why does it matter?', true));
    var learnt = block('What I learnt', field('p', it, 'lessons', 'prose', 'What went well, what was hard, and what would you do differently?', true));
    var skills = block('Skills I built', skillsField(it));
    var diary = renderDiary(it);

    [doing, learnt, skills, diary].forEach(function (n) { if (n) kids.push(n); });
    if (!editMode && !doing && !learnt && !skills && !diary) {
      kids.push(h('p', { class: 'empty', text: 'More about this one coming soon.' }));
    }

    var nav = [];
    nav.push(prev ? h('a', { href: '#/' + encodeURIComponent(prev.id) }, ['← ' + (tidy(prev.title) || 'Previous')]) : h('span'));
    if (next) nav.push(h('a', { href: '#/' + encodeURIComponent(next.id) }, [(tidy(next.title) || 'Next') + ' →']));
    kids.push(h('div', { class: 'page-nav' }, nav));

    return [h('div', { class: 'page' }, kids)];
  }

  /* ---------- edit bar ---------- */

  function loadFromFile() {
    var picker = h('input', { type: 'file', accept: '.html,text/html' });
    picker.addEventListener('change', function () {
      var f = picker.files && picker.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var m = String(reader.result).match(/<script id="site-data" type="application\/json">([\s\S]*?)<\/script>/);
        if (!m) { alert("Couldn't find your website content in that file. Make sure it's an index.html you downloaded from this page."); return; }
        try {
          data = upgrade(JSON.parse(m[1]));
          dirty = true;
          location.hash = '#/';
          render();
          alert('Loaded. Check everything looks right, then click Download index.html.');
        } catch (err) {
          alert("That file couldn't be read. Make sure it's an index.html you downloaded from this page.");
        }
      };
      reader.readAsText(f);
    });
    picker.click();
  }

  function renderBar() {
    if (!canEdit) return null;
    return h('div', { class: 'bar' }, [
      h('span', { text: editMode ? 'Editing. Nothing changes online until you upload the downloaded file.' : 'Previewing your changes.' }),
      h('div', { class: 'bar-btns' }, [
        h('button', { class: 'ghost', type: 'button', onclick: loadFromFile }, ['Load from file']),
        h('button', { class: 'ghost', type: 'button', onclick: function () { editMode = !editMode; render(); } }, [editMode ? 'Preview' : 'Keep editing']),
        h('button', { type: 'button', onclick: download }, ['Download index.html'])
      ])
    ]);
  }

  /* ---------- render ---------- */

  function render() {
    var name = tidy(data.name);
    var id = route();
    var it = id ? findItem(id) : null;
    document.title = it ? (tidy(it.title) || 'Experience') + (name ? ' | ' + name : '') : (name || 'Portfolio');

    var kids = it ? renderPage(it) : renderHome();
    kids.push(h('footer', { text: '© ' + new Date().getFullYear() + (name ? ' ' + name : '') }));
    app.replaceChildren(h('div', { class: 'wrap' + (canEdit ? ' has-bar' : '') }, kids));
    var bar = renderBar();
    if (bar) app.appendChild(bar);
  }

  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });

  /* ---------- download ---------- */

  function cleaned() {
    var c = JSON.parse(JSON.stringify(data));
    ['name', 'tagline', 'email', 'linkedin', 'resume', 'about'].forEach(function (k) { c[k] = tidy(c[k]); });
    var used = {};
    c.sections.forEach(function (s) {
      s.title = tidy(s.title);
      s.items = s.items.map(function (it) {
        var out = {
          id: it.id,
          title: tidy(it.title), org: tidy(it.org), when: tidy(it.when),
          summary: tidy(it.summary), story: tidy(it.story), lessons: tidy(it.lessons),
          skills: (it.skills || []).map(tidy).filter(Boolean),
          diary: (it.diary || []).map(function (e) { return { date: e.date || '', text: tidy(e.text) }; })
            .filter(function (e) { return e.text; })
        };
        // New entries get a readable web address based on their name.
        if (/^entry-/.test(out.id) && (out.title || out.org)) out.id = slugify(out.org ? out.org + ' ' + out.title : out.title);
        var base = out.id, n = 2;
        while (used[out.id]) out.id = base + '-' + (n++);
        used[out.id] = true;
        return out;
      }).filter(function (it) {
        return it.title || it.org || it.summary || it.story || it.lessons || it.diary.length;
      });
    });
    return c;
  }

  function escHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function download() {
    var c = cleaned();
    var json = JSON.stringify(c, null, 2).replace(/</g, '\\u003c');
    var out = ORIGINAL.replace(
      /(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/,
      function (m, a, b) { return a + '\n' + json + '\n' + b; }
    );
    out = out.replace(/<title>[\s\S]*?<\/title>/, function () { return '<title>' + escHtml(c.name || 'Portfolio') + '</title>'; });
    out = '<!DOCTYPE html>\n' + out;
    var blob = new Blob([out], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    dirty = false;
  }

  window.addEventListener('beforeunload', function (e) {
    if (canEdit && dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  render();
})();
</script>
</body>
</html>
